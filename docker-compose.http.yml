name: telegram-mcp

services:
  telegram-mcp:
    build:
      context: .
      dockerfile: Dockerfile.http
    container_name: telegram-mcp
    env_file:
      - .env
    ports:
      - "18797:18797"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
